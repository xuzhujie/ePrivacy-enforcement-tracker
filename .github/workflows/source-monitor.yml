name: source-monitor

on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check official source URLs
        id: source_check
        continue-on-error: true
        run: npm run sources:check -- --output source-status.json --history-output source-status-history.json
      - name: Upload source status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-status
          path: |
            source-status.json
            source-status-history.json
      - name: Prepare Pages source status snapshot
        if: always()
        run: |
          if [ -f source-status.json ]; then
            cp source-status.json public/source-status.json
          fi
          if [ -f source-status-history.json ]; then
            cp source-status-history.json public/source-status-history.json
          fi
      - name: Publish source status snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/source-status.json public/source-status-history.json
          if git diff --cached --quiet; then
            echo "Source status snapshot unchanged"
          else
            git commit -m "chore: refresh source status snapshot"
            git push
          fi
      - name: Fail when a source is unreachable
        if: steps.source_check.outcome == 'failure'
        run: exit 1
